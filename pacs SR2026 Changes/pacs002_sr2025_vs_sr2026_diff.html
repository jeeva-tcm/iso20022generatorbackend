const catLabel={type:'Data type',mandatory:'Made mandatory',multiplicity:'Multiplicity',value:'Fixed value'};
const catClass={type:'chip-type',mandatory:'chip-mand',multiplicity:'chip-mult',value:'chip-value'};

function render(filter){
  const rows=data.filter(d=>filter==='all'||d.cat===filter);
  document.getElementById('row-count').textContent=`Showing ${rows.length} of ${data.length} changes`;
  const tbody=document.getElementById('tbl-body');
  tbody.innerHTML=rows.map(r=>`
    <tr data-cat="${r.cat}">
      <td><span class="tag">&lt;${r.tag}&gt;</span></td>
      <td style="color:var(--color-text-secondary);font-size:12px">${r.path}</td>
      <td><span class="chip ${catClass[r.cat]}">${catLabel[r.cat]}</span></td>
      <td class="sr25-val">${r.sr25}</td>
      <td class="sr26-val">${r.sr26}</td>
    </tr>`).join('');
}

function filterTable(cat,btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render(cat);
}

render('all');
